source = ~/.colors/generated/hyprland/colors.conf

# BACKGROUND
background {
    monitor =
    color = $surface
    # path = screenshot
    blur_passes = 3
    contrast = 0.8916
    # brightness = 0.8
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 70
    outline_thickness = 2
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $outline
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = false
    font_family = Maple Mono NF Bold Italic
    placeholder_text = Git lost!
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
    rounding = 10
    dots_rounding = 4
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = $primary
    font_size = 180
    font_family = Maple Mono NF ExtraBold
    position = 0, 300
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = $secondary
    font_size = 180
    font_family = Maple Mono NF ExtraBold
    position = 0, 70
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, ')$(date '+%d %B')"
    color = $tertiary
    font_size = 30
    font_family = Maple Mono NF ExtraBold Italic
    position = 0, -80
    halign = center
    valign = center
}

